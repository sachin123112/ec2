server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: auth-service

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:gitsachin720@gmail.com}
    password: ${MAIL_PASSWORD:Sachin@123}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ec2_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        
  security:
    user:
      name: dev
      password: DevPass123

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    repair-on-migrate: true

  web:
    resources:
      static-locations: classpath:/static/,file:uploads/

  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:false}
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
  data:
    elasticsearch:
      repositories:
        enabled: ${ELASTICSEARCH_ENABLED:false}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
  drive:
    credentials-file: ${GOOGLE_DRIVE_CREDENTIALS_FILE:}
    folder-id: ${GOOGLE_DRIVE_FOLDER_ID:10tD0L0f_pMAYLlseUw22hL1g3Z3zQbK5}

jwt:
  secret: ${JWT_SECRET:ChangeThisToA256BitSecretKeyForProduction}
  expiration: 900000
