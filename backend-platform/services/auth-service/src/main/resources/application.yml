server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: auth-service

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ec2_db}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    elasticsearch:
      repositories:
        enabled: ${ELASTICSEARCH_ENABLED:false}

  cache:
    type: ${CACHE_TYPE:none}
    redis:
      time-to-live: ${CACHE_DEFAULT_TTL:PT60S}
      cache-null-values: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    repair-on-migrate: true

  web:
    resources:
      static-locations: classpath:/static/,file:uploads/

  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:false}
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
  drive:
    credentials-file: ${GOOGLE_DRIVE_CREDENTIALS_FILE:}
    folder-id: ${GOOGLE_DRIVE_FOLDER_ID:10tD0L0f_pMAYLlseUw22hL1g3Z3zQbK5}

imagekit:
  private-key: ${IMAGEKIT_PRIVATE_KEY:}
  public-key: ${IMAGEKIT_PUBLIC_KEY:}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT:}

jwt:
  secret: ${JWT_SECRET:}
  expiration: 900000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

backup:
  directory: ${BACKUP_DIRECTORY:backups}
  pg-dump-path: ${PG_DUMP_PATH:pg_dump}
  cron: ${BACKUP_CRON:0 0 2 * * *}
