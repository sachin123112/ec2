version: "3.8"
services:
  redis:
    image: redis:7.2
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    environment:
      - REDIS_PASSWORD=changeme
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
